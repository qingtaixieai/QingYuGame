name: Verify Qingyu
on: [push, pull_request]
permissions:
  contents: read
jobs:
  client-and-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s scripts -p 'test_*.py'
      - run: python scripts/engineering_check.py
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: node --experimental-strip-types --test scripts/*.test.mjs
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: qingyu_phase1_ci
          POSTGRES_USER: worldgame
          POSTGRES_PASSWORD: local-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U worldgame -d qingyu_phase1_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PHASE1_DATABASE_URL: jdbc:postgresql://127.0.0.1:5432/qingyu_phase1_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn --batch-mode verify
        working-directory: backend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-test-results
          path: backend/target/surefire-reports/
