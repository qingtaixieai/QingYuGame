spring.application.name=world-game
server.address=${BIND_ADDRESS:127.0.0.1}
server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.tomcat.threads.max=32
server.tomcat.max-http-form-post-size=16KB
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://127.0.0.1:5432/worldgame}
spring.datasource.username=${DATABASE_USER:worldgame}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.flyway.enabled=true
spring.jackson.deserialization.fail-on-unknown-properties=true
app.origin=${APP_ORIGIN:http://localhost:5173}
app.secure-cookie=${SECURE_COOKIE:true}
app.admin-name=${ADMIN_USERNAME:admin}
app.admin-password=${ADMIN_PASSWORD:}
server.error.include-message=never

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
